version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/code/src/AttendeeSite"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "minimist"
    open-pull-requests-limit: 1
  - package-ecosystem: "nuget"
    directory: "/code/"
    schedule:
      interval: "weekly"
